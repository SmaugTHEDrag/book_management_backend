spring.application.name=BookManagement
# -----------------------
# Database
# -----------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# The schema is managed outside the application:
#   existing database -> BookManagementKeycloakMigration.sql (users table alignment)
# For production prefer a migration tool (Flyway/Liquibase) plus:
#   spring.jpa.hibernate.ddl-auto=validate

# -----------------------
# Naming entity mapping table in SQL
# -----------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -----------------------
# Show sql
# -----------------------
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# -----------------------
# Security - Keycloak resource server
# -----------------------
# Spring Security/Boot discover the JWKS endpoint from the issuer and validate
# signature, issuer and expiration of every Bearer token. No custom JWT code involved.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/book-management}

# Authentication is fully delegated to Keycloak, so Spring Boot must not
# create its default in-memory user (and log a random password).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# -----------------------
# CORS - explicit frontend origins, comma separated
# e.g. https://book-management-frontend-ecru.vercel.app
# -----------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# -----------------------
# Gemini API Configuration
# -----------------------
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL}

# -----------------------
# Cloudinary Configuration
# -----------------------
cloudinary.cloud_name=${CLOUDINARY_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

# -----------------------
# AI Moderation
# -----------------------
ai.moderation.url=${AI_MODERATION_URL}
